services:
  patchlens:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PATCHLENS_PORT:-3000}:3000'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/apps/web/.next/cache:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
